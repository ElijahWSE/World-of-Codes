<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImpactGround</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* Remove all default browser spacing and scrollbars */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #FFF6E4;
      overflow: hidden; /* No scrollbars — game canvas fills the viewport */
      font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Full-viewport host div — Phaser's Scale Manager (FIT + autoCenter) sizes
       and centers the canvas inside this automatically. */
    #game-container {
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <!-- Phaser boots from main.js and appends its canvas into #game-container automatically -->
  <script type="module" src="/src/engine/main.js"></script>
</body>
</html>
